name: Deploy OTCBOT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - otcbot
    steps:
      - name: Deploy on server runner
        run: |
          set -e
          cd /home/happy/new-api-repo
          chmod +x deploy/otcbot-deploy.sh
          ./deploy/otcbot-deploy.sh
